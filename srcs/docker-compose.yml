version: '3.8'

secrets:
    db_password:
        file: ../secrets/db_password.txt
    db_root_password:
        file: ../secrets/db_root_password.txt
    wp_password:
        file: ../secrets/wp_password.txt

networks:
    Bnet:
        driver: bridge

volumes:
    mariadb_data:
        driver: local
        name: $DATABASE_VOL
        driver_opts:
            type: none
            o: bind
            device: /home/bn-bn/data/db
    wordpress_data:
        driver: local
        name: $WORDPRESS_VOL
        driver_opts:
            type: none
            o: bind
            device: /home/bn-bn/data/wordpress

services:
    nginx:
        container_name: server
        depends_on:
            - wordpress
        build: 
            context : requirements/nginx
            dockerfile: Dockerfile
        image: nginx:v1
        ports:
            - 443:443
        env_file:
            - .env
        networks:
            - Bnet
        volumes:
            - wordpress_data:/var/www/wordpress
        restart: always

    wordpress:
        container_name: client
        depends_on:
            - mariadb
        build: 
            context : requirements/wordpress
            dockerfile: Dockerfile
        image: wordpress:v1
        env_file:
            - .env
        secrets:
            - db_password
            - wp_password
        networks:
            - Bnet
        volumes:
            - wordpress_data:/var/www/wordpress
        restart: always

    mariadb:
        container_name: database
        build: 
            context : requirements/mariadb
            dockerfile: Dockerfile
        image: mariadb:v1
        env_file:
            - .env
        secrets:
            - db_password
            - db_root_password
        networks:
            - Bnet
        volumes:
            - mariadb_data:/var/lib/mysql
        restart: always
