server {
    listen 443 ssl;
    server_name kben-tou.42.fr;

    ssl_certificate     /etc/nginx/ssl/certs/bn.crt;
    ssl_certificate_key /etc/nginx/ssl/private/bn.key;

    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/wordpress;
    index index.php;

    location ~ \.php {
        include fastcgi_params;
        fastcgi_pass 172.17.0.3:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # location / {

    #     root /var/www/html;
    #     index bn.html;
    # }
}